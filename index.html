<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F5F1E9">
  <title>BiBi-Schedule</title>

  <link rel="apple-touch-icon" href="/schedule/icon.png">
  <link rel="icon" type="image/png" href="/schedule/icon.png">

  <!-- Preconnect to remote font/data CDNs -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <!-- Preload critical local font -->
  <link rel="preload" href="/schedule/NaikaiFont-SemiBold.woff2" as="font" type="font/woff2" crossorigin>

  <!-- PWA Manifest -->
  <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22BiBi-Schedule%22%2C%22short_name%22%3A%22BiBi%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23F5F1E9%22%2C%22theme_color%22%3A%22%23F5F1E9%22%2C%22orientation%22%3A%22portrait%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22icon.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

  <style>
    .initial-loader {
      display: flex; justify-content: center; align-items: center; height: 100dvh;
      background-color: #F5F1E9; color: #C2A385;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid currentColor;
      border-top-color: transparent; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    // 選了「午夜黑咖」主題的裝置：在第一次繪製前就把底色換成黑，
    // 避免每次開啟都先閃一下米色 (React 掛載後才會套主題)。
    try {
      if (localStorage.getItem('bibi_theme') === 'dark') {
        var darkStyle = document.createElement('style');
        darkStyle.textContent = 'body{background-color:#0E0E10!important;color:#EAE5DF!important}.initial-loader{background-color:#0E0E10!important;color:#C2A385!important}';
        document.head.appendChild(darkStyle);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', '#0E0E10');
      }
    } catch (e) {}
  </script>
</head>
<body style="background-color: #F5F1E9; color: #5D4037; overflow: hidden;">
  <div id="root">
    <div class="initial-loader">
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/schedule/sw.js').then((reg) => {
          // 偵測新版本：updatefound → installing → installed (有 controller 表示是「更新」而非首次安裝)
          reg.addEventListener('updatefound', () => {
            const newSW = reg.installing;
            if (!newSW) return;
            newSW.addEventListener('statechange', () => {
              if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                newSW.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
          // 主動每分鐘檢查一次，PWA 長時間開著也能拿到新版
          setInterval(() => reg.update().catch(() => {}), 60 * 1000);
        }).catch((err) => {
          console.warn('SW registration failed:', err);
        });
        // 新 SW 接管後 reload 一次，讓使用者立刻看到新版
        let _swReloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (_swReloaded) return;
          _swReloaded = true;
          window.location.reload();
        });
      });
    }
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
